services:
  homelab-agent-mesh:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homelab-agent-mesh
    restart: unless-stopped
    user: "root"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    volumes:
      - ./config/settings.yaml:/app/config/settings.yaml:ro
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 48M
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; port = os.environ.get('APP_PORT', '8080'); urllib.request.urlopen(f'http://127.0.0.1:{port}/api/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

