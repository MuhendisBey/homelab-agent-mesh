# ==============================================================================
# homelab-agent-mesh - Spatial Thermal Digital Twin Lovelace Dashboard Template
# ==============================================================================
# Sanitized public-safe template using synthetic zone IDs (`living_room`,
# `bedroom`, `study`) and generic Home Assistant entity IDs.
# Zero personal identifiers, real entity IDs, or private IPs are committed here.
# ==============================================================================
title: Thermal Digital Twin
views:
  - type: sections
    title: Interactive Twin & Analytics
    path: overview
    icon: mdi:home-thermometer-outline
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Interactive Zone Explorer & RC Cooling Projection
            icon: mdi:chart-bell-curve-cumulative
          - type: custom:thermal-twin-analytics-card
            mode: interactive_explorer
            title: Room Selector & 8-Hour RC Cooling Curve
            outdoor_temp_entity: sensor.outdoor_temperature
            hours_ahead: 8
            zones:
              - id: living_room
                name: Living Room
                color: "#38bdf8"
                true_temp_entity: sensor.thermal_twin_living_room_true_temp
                stats_entity: sensor.thermal_twin_living_room_stats
                climate_entity: climate.living_room_thermostat
                valve_entity: sensor.living_room_valve_position
                max_valve_entity: number.living_room_max_valve_position
                raw_etrv_entity: sensor.living_room_trv_actual_temperature
              - id: bedroom
                name: Bedroom
                color: "#34d399"
                true_temp_entity: sensor.thermal_twin_bedroom_true_temp
                stats_entity: sensor.thermal_twin_bedroom_stats
                climate_entity: climate.bedroom_radiator_valve
                valve_entity: sensor.bedroom_valve_position
                max_valve_entity: number.bedroom_max_valve_position
                ambient_entity: sensor.bedroom_ambient_temperature
                humidity_entity: sensor.bedroom_ambient_humidity
              - id: study
                name: Study
                color: "#a78bfa"
                true_temp_entity: sensor.thermal_twin_study_true_temp
                stats_entity: sensor.thermal_twin_study_stats
                climate_entity: climate.study_radiator_valve
                valve_entity: sensor.study_valve_position
                max_valve_entity: number.study_max_valve_position

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Volume, Thermal Loss & Valve Allocation (Pie Charts)
            icon: mdi:chart-donut
          - type: custom:thermal-twin-analytics-card
            mode: pie_charts
            title: Building Envelope & Hydraulic Valve Share
            outdoor_temp_entity: sensor.outdoor_temperature
            zones:
              - id: living_room
                name: Living Room
                color: "#38bdf8"
                true_temp_entity: sensor.thermal_twin_living_room_true_temp
                stats_entity: sensor.thermal_twin_living_room_stats
                valve_entity: sensor.living_room_valve_position
                max_valve_entity: number.living_room_max_valve_position
              - id: bedroom
                name: Bedroom
                color: "#34d399"
                true_temp_entity: sensor.thermal_twin_bedroom_true_temp
                stats_entity: sensor.thermal_twin_bedroom_stats
                valve_entity: sensor.bedroom_valve_position
                max_valve_entity: number.bedroom_max_valve_position
              - id: study
                name: Study
                color: "#a78bfa"
                true_temp_entity: sensor.thermal_twin_study_true_temp
                stats_entity: sensor.thermal_twin_study_stats
                valve_entity: sensor.study_valve_position
                max_valve_entity: number.study_max_valve_position

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: AI Thermal Advisor Report
            icon: mdi:robot-outline
          - type: markdown
            title: Daily Briefing & Anomaly Insights
            content: |
              ### {{ states('sensor.thermal_twin_advisor_report') }}
              ---
              {{ state_attr('sensor.thermal_twin_advisor_report', 'report_markdown') or states('sensor.thermal_twin_advisor_report') }}

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Outdoor & Boiler Telemetry
            icon: mdi:weather-partly-cloudy
          - type: sensor
            entity: sensor.outdoor_temperature
            name: Outdoor Temperature Trend
            graph: line
            hours_to_show: 24
          - type: tile
            entity: weather.home
            name: Weather Forecast

  - type: sections
    title: Live Gauges & Hydraulics
    path: gauges
    icon: mdi:gauge
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: True Room Temperature Gauges
            icon: mdi:thermometer
          - type: gauge
            entity: sensor.thermal_twin_living_room_true_temp
            name: Living Room True Temp
            min: 14
            max: 26
            needle: true
            severity:
              yellow: 14
              green: 18.5
              red: 23.5
          - type: gauge
            entity: sensor.thermal_twin_bedroom_true_temp
            name: Bedroom True Temp
            min: 14
            max: 26
            needle: true
            severity:
              yellow: 14
              green: 17.5
              red: 22.5
          - type: gauge
            entity: sensor.thermal_twin_study_true_temp
            name: Study True Temp
            min: 14
            max: 26
            needle: true
            severity:
              yellow: 14
              green: 18.5
              red: 23.5

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Radiator Valve Opening (%) & Max Limits
            icon: mdi:valve
          - type: gauge
            entity: sensor.living_room_valve_position
            name: Living Room Valve
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 50
              red: 85
          - type: gauge
            entity: sensor.bedroom_valve_position
            name: Bedroom Valve
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 50
              red: 85
          - type: gauge
            entity: sensor.study_valve_position
            name: Study Valve
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 50
              red: 85

  - type: sections
    title: Time Series & Psychrometrics
    path: history-psychrometrics
    icon: mdi:chart-areaspline
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Psychrometric Comfort & Dew-Point Matrix
            icon: mdi:water-percent
          - type: custom:thermal-twin-analytics-card
            mode: psychrometrics_matrix
            title: Absolute Humidity, Dew Point & Mold Margin
            outdoor_temp_entity: sensor.outdoor_temperature
            zones:
              - id: living_room
                name: Living Room
                color: "#38bdf8"
                true_temp_entity: sensor.thermal_twin_living_room_true_temp
                stats_entity: sensor.thermal_twin_living_room_stats
              - id: bedroom
                name: Bedroom
                color: "#34d399"
                true_temp_entity: sensor.thermal_twin_bedroom_true_temp
                stats_entity: sensor.thermal_twin_bedroom_stats
                humidity_entity: sensor.bedroom_ambient_humidity
              - id: study
                name: Study
                color: "#a78bfa"
                true_temp_entity: sensor.thermal_twin_study_true_temp
                stats_entity: sensor.thermal_twin_study_stats

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: 24h Calibrated vs. Raw eTRV History
            icon: mdi:chart-line
          - type: history-graph
            title: Living Room & Bedroom — True vs. Raw eTRV
            hours_to_show: 24
            entities:
              - entity: sensor.thermal_twin_living_room_true_temp
                name: Living Room True
              - entity: climate.living_room_thermostat
                name: Living Room Raw eTRV
              - entity: sensor.thermal_twin_bedroom_true_temp
                name: Bedroom True
              - entity: sensor.bedroom_ambient_temperature
                name: Bedroom Ambient
              - entity: climate.bedroom_radiator_valve
                name: Bedroom Raw eTRV

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: 7-Day Multi-Zone Temperature Trends
            icon: mdi:chart-bar
          - type: statistics-graph
            title: 7-Day True Ambient Temperature Trends
            chart_type: line
            period: hour
            days_to_show: 7
            stat_types:
              - mean
              - min
              - max
            entities:
              - sensor.thermal_twin_living_room_true_temp
              - sensor.thermal_twin_bedroom_true_temp
              - sensor.thermal_twin_study_true_temp
