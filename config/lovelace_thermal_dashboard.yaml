# ==============================================================================
# homelab-agent-mesh - Spatial Thermal Digital Twin Lovelace Dashboard Template
# ==============================================================================
# Public-safe, ready-to-import Home Assistant Lovelace Dashboard configuration.
# Replace the example zone slugs (`living_room`, `bedroom`, `study`) and entity
# IDs with your own Home Assistant zones and NeonPlan-derived `zone_id` slugs.
#
# Import in Home Assistant:
#   Settings -> Dashboards -> Add Dashboard -> New dashboard from scratch ->
#   Edit Dashboard (top-right pencil) -> Three dots -> Raw configuration editor ->
#   Paste this YAML and Save.
# ==============================================================================

title: Thermal Digital Twin
views:
  - type: sections
    title: Overview & Advisor
    path: overview
    icon: mdi:home-thermometer-outline
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Thermal Digital Twin Advisor
            icon: mdi:robot-outline
          - type: markdown
            title: Morning Thermal Briefing & Diagnostics
            grid_options:
              columns: full
            content: |
              ## {{ states('sensor.thermal_twin_advisor_report') }}
              ---
              {%- set raw = state_attr('sensor.thermal_twin_advisor_report', 'report_markdown') or states('sensor.thermal_twin_advisor_report') -%}
              {%- for line in raw.split('\n') %}
              {%- if line.startswith('### ') %}
              ## {{ line[4:] }}
              {%- elif line.startswith('|') and '---' not in line %}
              {{ line | replace('| ', '| <big>') }}
              {%- elif line.startswith('- ') %}
              - <big>{{ line[2:] }}</big>
              {%- else %}
              {{ line }}
              {%- endif %}
              {%- endfor %}

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Outdoor & Heating Plant
            icon: mdi:weather-partly-cloudy
          - type: tile
            entity: weather.home
            name: Local Weather
            grid_options:
              columns: full
          - type: tile
            entity: sensor.outdoor_temperature
            name: Outdoor Temperature
            grid_options:
              columns: full
          - type: tile
            entity: sensor.heating_pump_modulation
            name: Boiler / Pump Modulation
            grid_options:
              columns: full
          - type: tile
            entity: switch.hydraulic_balancing
            name: Hydraulic Balancing
            grid_options:
              columns: full
          - type: entities
            title: Envelope Boundary Conditions
            show_header_toggle: false
            grid_options:
              columns: full
            entities:
              - entity: sensor.indoor_reference_temperature
                name: Main Thermostat Reference
              - entity: sensor.indoor_reference_humidity
                name: Main Reference Humidity
              - entity: sensor.heating_return_temperature
                name: Boiler Return Temperature
              - entity: sensor.heating_system_pressure
                name: System Pressure

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: True Ambient & Valve Summary
            icon: mdi:thermometer-check
          - type: entities
            title: Calibrated True Room Temperatures
            show_header_toggle: false
            grid_options:
              columns: full
            entities:
              - entity: sensor.thermal_twin_living_room_true_temp
                name: Living Room
              - entity: sensor.thermal_twin_bedroom_true_temp
                name: Bedroom
              - entity: sensor.thermal_twin_study_true_temp
                name: Study
          - type: entities
            title: Radiator Valve Openings & Max Limits
            show_header_toggle: false
            grid_options:
              columns: full
            entities:
              - entity: sensor.living_room_valve_position
                name: Living Room Valve Position
              - type: attribute
                entity: sensor.thermal_twin_living_room_stats
                attribute: max_valve_pct
                name: Living Room Max Valve Limit
                icon: mdi:valve
                suffix: " %"
              - entity: sensor.bedroom_valve_position
                name: Bedroom Valve Position
              - type: attribute
                entity: sensor.thermal_twin_bedroom_stats
                attribute: max_valve_pct
                name: Bedroom Max Valve Limit
                icon: mdi:valve
                suffix: " %"
              - entity: sensor.study_valve_position
                name: Study Valve Position
              - type: attribute
                entity: sensor.thermal_twin_study_stats
                attribute: max_valve_pct
                name: Study Max Valve Limit
                icon: mdi:valve
                suffix: " %"

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Cooling Rates & Overnight Forecasts
            icon: mdi:chart-line-variant
          - type: entities
            title: Cooling Rates & Envelope Stats
            show_header_toggle: false
            grid_options:
              columns: full
            entities:
              - entity: sensor.thermal_twin_living_room_stats
                name: Living Room Stats
              - entity: sensor.thermal_twin_bedroom_stats
                name: Bedroom Stats
              - entity: sensor.thermal_twin_study_stats
                name: Study Stats
          - type: entities
            title: Overnight Min Temperature Projection (8h)
            show_header_toggle: false
            grid_options:
              columns: full
            entities:
              - type: attribute
                entity: sensor.thermal_twin_living_room_stats
                attribute: night_min_temp_c
                name: Living Room
                suffix: " °C"
              - type: attribute
                entity: sensor.thermal_twin_bedroom_stats
                attribute: night_min_temp_c
                name: Bedroom
                suffix: " °C"
              - type: attribute
                entity: sensor.thermal_twin_study_stats
                attribute: night_min_temp_c
                name: Study
                suffix: " °C"

  - type: sections
    title: History & Comparison
    path: history
    icon: mdi:chart-line
    max_columns: 2
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: 24h True Ambient vs. Raw eTRV
            icon: mdi:chart-bell-curve
          - type: history-graph
            title: Living Room — True Ambient vs. Thermostat & Sensor
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.thermal_twin_living_room_true_temp
                name: True Ambient
              - entity: climate.living_room_thermostat
                name: Raw eTRV
              - entity: sensor.living_room_temperature
                name: Room Sensor
          - type: history-graph
            title: Bedroom — True Ambient vs. eTRV & Sensor
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.thermal_twin_bedroom_true_temp
                name: True Ambient
              - entity: climate.bedroom_radiator_valve
                name: Raw eTRV
              - entity: sensor.bedroom_temperature
                name: Room Sensor

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Study & 7-Day Thermal Trends
            icon: mdi:chart-areaspline
          - type: history-graph
            title: Study — True Ambient vs. eTRV
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.thermal_twin_study_true_temp
                name: True Ambient
              - entity: climate.study_radiator_valve
                name: Raw eTRV
              - entity: sensor.study_temperature
                name: Room Sensor
          - type: statistics-graph
            title: 7-Day Calibrated Zone Temperatures
            chart_type: line
            period: hour
            days_to_show: 7
            grid_options:
              columns: full
            stat_types:
              - mean
              - min
              - max
            entities:
              - sensor.thermal_twin_living_room_true_temp
              - sensor.thermal_twin_bedroom_true_temp
              - sensor.thermal_twin_study_true_temp

  - type: sections
    title: Zone Details & Psychrometrics
    path: zones
    icon: mdi:water-percent
    max_columns: 3
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Living Room
            icon: mdi:sofa
          - type: entities
            title: Thermal & Psychrometric Telemetry
            show_header_toggle: false
            grid_options:
              columns: full
            entities:
              - entity: sensor.thermal_twin_living_room_true_temp
                name: True Ambient Temp
              - entity: climate.living_room_thermostat
                name: Climate Entity
              - entity: sensor.living_room_valve_position
                name: Valve Position
              - entity: binary_sensor.living_room_window_contact
                name: Window Contact
              - entity: sensor.thermal_twin_living_room_stats
                name: Cooling Rate
              - type: attribute
                entity: sensor.thermal_twin_living_room_stats
                attribute: k_loss
                name: Heat Loss Coefficient (k)
                suffix: " 1/h"
              - type: attribute
                entity: sensor.thermal_twin_living_room_stats
                attribute: tau_hours
                name: Thermal Time Constant (tau)
                suffix: " h"
              - type: attribute
                entity: sensor.thermal_twin_living_room_stats
                attribute: cooling_rate_c_per_h
                name: Cooling Rate (Detail)
                suffix: " °C/h"
              - type: attribute
                entity: sensor.thermal_twin_living_room_stats
                attribute: night_min_temp_c
                name: Overnight Min Projection
                suffix: " °C"
              - type: attribute
                entity: sensor.thermal_twin_living_room_stats
                attribute: absolute_humidity_g_m3
                name: Absolute Humidity
                suffix: " g/m³"
              - type: attribute
                entity: sensor.thermal_twin_living_room_stats
                attribute: dew_point_c
                name: Dew Point
                suffix: " °C"
              - type: attribute
                entity: sensor.thermal_twin_living_room_stats
                attribute: optimal_ventilation_min
                name: Optimal Ventilation
                suffix: " min"
              - type: attribute
                entity: sensor.thermal_twin_living_room_stats
                attribute: spatial_gradient_c
                name: eTRV Spatial Gradient
                suffix: " °C"
              - type: attribute
                entity: sensor.thermal_twin_living_room_stats
                attribute: max_valve_pct
                name: Max Valve Limit (Stats)
                suffix: "%"
              - type: attribute
                entity: sensor.thermal_twin_living_room_stats
                attribute: frost_protection_active
                name: Frost Protection Active
              - type: attribute
                entity: sensor.thermal_twin_living_room_stats
                attribute: anomaly_detected
                name: Anomaly Detected

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Bedroom
            icon: mdi:bed
          - type: entities
            title: Thermal & Psychrometric Telemetry
            show_header_toggle: false
            grid_options:
              columns: full
            entities:
              - entity: sensor.thermal_twin_bedroom_true_temp
                name: True Ambient Temp
              - entity: climate.bedroom_radiator_valve
                name: Climate Entity
              - entity: sensor.bedroom_valve_position
                name: Valve Position
              - entity: binary_sensor.bedroom_window_contact
                name: Window Contact
              - entity: sensor.thermal_twin_bedroom_stats
                name: Cooling Rate
              - type: attribute
                entity: sensor.thermal_twin_bedroom_stats
                attribute: k_loss
                name: Heat Loss Coefficient (k)
                suffix: " 1/h"
              - type: attribute
                entity: sensor.thermal_twin_bedroom_stats
                attribute: tau_hours
                name: Thermal Time Constant (tau)
                suffix: " h"
              - type: attribute
                entity: sensor.thermal_twin_bedroom_stats
                attribute: cooling_rate_c_per_h
                name: Cooling Rate (Detail)
                suffix: " °C/h"
              - type: attribute
                entity: sensor.thermal_twin_bedroom_stats
                attribute: night_min_temp_c
                name: Overnight Min Projection
                suffix: " °C"
              - type: attribute
                entity: sensor.thermal_twin_bedroom_stats
                attribute: absolute_humidity_g_m3
                name: Absolute Humidity
                suffix: " g/m³"
              - type: attribute
                entity: sensor.thermal_twin_bedroom_stats
                attribute: dew_point_c
                name: Dew Point
                suffix: " °C"
              - type: attribute
                entity: sensor.thermal_twin_bedroom_stats
                attribute: optimal_ventilation_min
                name: Optimal Ventilation
                suffix: " min"
              - type: attribute
                entity: sensor.thermal_twin_bedroom_stats
                attribute: spatial_gradient_c
                name: eTRV Spatial Gradient
                suffix: " °C"
              - type: attribute
                entity: sensor.thermal_twin_bedroom_stats
                attribute: max_valve_pct
                name: Max Valve Limit (Stats)
                suffix: "%"
              - type: attribute
                entity: sensor.thermal_twin_bedroom_stats
                attribute: frost_protection_active
                name: Frost Protection Active
              - type: attribute
                entity: sensor.thermal_twin_bedroom_stats
                attribute: anomaly_detected
                name: Anomaly Detected

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Study
            icon: mdi:desk
          - type: entities
            title: Thermal & Psychrometric Telemetry
            show_header_toggle: false
            grid_options:
              columns: full
            entities:
              - entity: sensor.thermal_twin_study_true_temp
                name: True Ambient Temp
              - entity: climate.study_radiator_valve
                name: Climate Entity
              - entity: sensor.study_valve_position
                name: Valve Position
              - entity: binary_sensor.study_window_contact
                name: Window Contact
              - entity: sensor.thermal_twin_study_stats
                name: Cooling Rate
              - type: attribute
                entity: sensor.thermal_twin_study_stats
                attribute: k_loss
                name: Heat Loss Coefficient (k)
                suffix: " 1/h"
              - type: attribute
                entity: sensor.thermal_twin_study_stats
                attribute: tau_hours
                name: Thermal Time Constant (tau)
                suffix: " h"
              - type: attribute
                entity: sensor.thermal_twin_study_stats
                attribute: cooling_rate_c_per_h
                name: Cooling Rate (Detail)
                suffix: " °C/h"
              - type: attribute
                entity: sensor.thermal_twin_study_stats
                attribute: night_min_temp_c
                name: Overnight Min Projection
                suffix: " °C"
              - type: attribute
                entity: sensor.thermal_twin_study_stats
                attribute: absolute_humidity_g_m3
                name: Absolute Humidity
                suffix: " g/m³"
              - type: attribute
                entity: sensor.thermal_twin_study_stats
                attribute: dew_point_c
                name: Dew Point
                suffix: " °C"
              - type: attribute
                entity: sensor.thermal_twin_study_stats
                attribute: optimal_ventilation_min
                name: Optimal Ventilation
                suffix: " min"
              - type: attribute
                entity: sensor.thermal_twin_study_stats
                attribute: spatial_gradient_c
                name: eTRV Spatial Gradient
                suffix: " °C"
              - type: attribute
                entity: sensor.thermal_twin_study_stats
                attribute: max_valve_pct
                name: Max Valve Limit (Stats)
                suffix: "%"
              - type: attribute
                entity: sensor.thermal_twin_study_stats
                attribute: frost_protection_active
                name: Frost Protection Active
              - type: attribute
                entity: sensor.thermal_twin_study_stats
                attribute: anomaly_detected
                name: Anomaly Detected
