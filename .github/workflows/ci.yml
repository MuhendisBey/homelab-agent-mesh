name: CI & Container Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Test & Secret Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package and verification tools
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio ruff mypy types-PyYAML

      - name: Secret hygiene check
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -E '(^|/)\.env(\.[^/]+)?$|(^|/)config/settings\.yaml$|\.(db|sqlite|sqlite3)$' | grep -vE '\.env\.example$|settings\.example\.yaml$' || true)
          if [ -n "$forbidden" ]; then
            echo "ERROR: Forbidden secret or runtime database files tracked in git:"
            echo "$forbidden"
            exit 1
          fi

      - name: Ruff lint
        run: ruff check --select E,F,I,UP --ignore E501 src tests

      - name: Mypy strict typecheck
        run: mypy --strict src tests

      - name: Pytest suite
        run: pytest -v

  publish-image:
    name: Build & Push linux/amd64 Image to Private GHCR
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/muhendisbey/homelab-agent-mesh
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}

      - name: Build and push linux/amd64 container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify no secrets or runtime DB baked into image
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE="ghcr.io/muhendisbey/homelab-agent-mesh:sha-${SHORT_SHA}"
          docker pull "$IMAGE"
          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -e
            test ! -f /app/.env
            test ! -f /app/config/settings.yaml
            test ! -e /app/data/reflection_memory.db
            echo "Image hygiene verified clean: $IMAGE"
          '
