[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "homelab-agent-mesh"
version = "2.0.1"
description = "Production-grade Hierarchical Multi-Agent Homelab & Smart Home Orchestrator built with Strands Agents SDK and FastAPI SSE."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
  { name = "Homelab Systems Integrator" }
]
dependencies = [
  "strands-agents[gemini]>=1.60.0",
  "google-genai>=1.0.0",
  "mcp>=2.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings[yaml]>=2.6.0",
  "PyYAML>=6.0.1",
  "websockets>=13.0",
  "httpx>=0.27.0",
  "psutil>=6.0.0",
  "docker>=7.1.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "mypy>=1.11.0",
  "ruff>=0.6.0",
  "types-PyYAML>=6.0.12",
  "types-psutil>=6.0.0",
]

[project.scripts]
homelab-orchestrator = "src.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 105
target-version = "py312"

